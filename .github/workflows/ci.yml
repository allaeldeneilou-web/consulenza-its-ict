name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build sito (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folder_sito
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folder_sito/infra/tf
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate
  
  checkov:
    name: Checkov IaC security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: folder_sito/infra/tf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install checkov

      - name: Run Checkov
        run: |
          checkov \
            -d . \
            --config-file checkov/baseline/checkov.yml \
            --external-checks-dir checkov/checks